<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>판매·손익 대시보드</title>
<style>
:root{
  --bg1:#e8eeeb; --bg2:#d9e4df;
  --card:#ffffff; --ink:#1d2733; --ink2:#4b5663; --ink3:#78828d;
  --line:#e3e8e6; --grid:#edf1ef;
  --navy:#34405a; --up:#1f4f9f; --dn:#b4501f;
  --side:#232b33; --side2:#2e3841; --mint:#9cc9b5;
  --r:20px;
  --font:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));min-height:100vh;font-variant-numeric:tabular-nums;line-height:1.4}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #2a78d6;outline-offset:2px}
.layout{max-width:1480px;margin:0 auto;padding:14px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media(min-width:1100px){.layout{grid-template-columns:minmax(0,1fr) 288px;padding:22px;gap:20px;align-items:start}}
main{display:flex;flex-direction:column;gap:14px;min-width:0}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.top h1{font-size:clamp(19px,2.4vw,24px);font-weight:800;letter-spacing:-.02em}
.top .sub{font-size:12.5px;color:var(--ink2);margin-top:2px}
.sample{display:inline-block;margin-left:8px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--ink2);vertical-align:middle}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:12px;font-weight:700;font-size:13px;background:#fff;border:1px solid var(--line);box-shadow:0 1px 2px rgba(20,40,60,.06)}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.top-actions{display:flex;gap:8px}
@media(min-width:1100px){.top .only-m{display:none}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;align-items:center}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--ink2);white-space:nowrap}
.chip[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip[aria-pressed=true]:before{content:"✓ ";font-weight:800}
.chip.tag{background:#fff;border-color:var(--navy);color:var(--navy)}
.chips .gap{flex:none;width:1px;height:20px;background:#b9c6c0;margin:0 2px}

.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}}
.kpi{position:relative;border-radius:var(--r);padding:14px 14px 12px;color:#fff;display:flex;flex-direction:column;gap:6px;min-height:176px;overflow:hidden;box-shadow:0 8px 20px -10px rgba(30,45,60,.45);transition:transform .15s}
.kpi:hover{transform:translateY(-2px)}
.kpi.k1{background:linear-gradient(150deg,#3d4a66,#2f3a53)}
.kpi.k2{background:linear-gradient(150deg,#5a917c,#46786a)}
.kpi.k3{background:linear-gradient(150deg,#e4bd7c,#d4a65f);color:#25201a}
.kpi.k4{background:linear-gradient(150deg,#e8a784,#d98f68);color:#2a1d16}
.kpi.on{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--ink),0 10px 22px -10px rgba(30,45,60,.5)}
.k-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.k-name{font-size:13.5px;font-weight:800}
.k-tag{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:99px;background:rgba(255,255,255,.92);color:var(--ink);visibility:hidden;white-space:nowrap}
.kpi.on .k-tag{visibility:visible}
.k-per{font-size:11px;opacity:.88;margin-top:-4px}
.k-val{font-size:clamp(23px,3.4vw,31px);font-weight:800;letter-spacing:-.02em;line-height:1.1}
.k-val small{font-size:11px;font-weight:600;margin-left:4px;opacity:.85}
.k-rows{display:flex;flex-direction:column;gap:3px;font-size:11.5px;position:relative;z-index:1}
.k-rows div{display:flex;justify-content:space-between;gap:6px;align-items:center}
.k-rows span.l{opacity:.88}
@media(max-width:420px){.kpi{padding:12px 11px 10px;min-height:168px}.k-name{font-size:13px}.k-tag{font-size:10px;padding:2px 5px}.k-rows{font-size:11px}.d{font-size:11px;padding:1px 6px}}
.spark{position:absolute;right:0;bottom:0;left:0;height:56px;opacity:.28;pointer-events:none}
.d{display:inline-block;font-weight:800;font-size:11.5px;padding:1px 7px;border-radius:99px;background:rgba(255,255,255,.93);white-space:nowrap;color:var(--ink)}
.d.up{color:var(--up)} .d.dn{color:var(--dn)} .d.flat,.d.na{color:var(--ink2)}
.panel .d{background:#eef2f6}

.panel{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 8px 24px -14px rgba(30,45,60,.35);min-width:0}
.p-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.p-head h2{font-size:15px;font-weight:800;letter-spacing:-.01em}
.p-head .note{font-size:11.5px;color:var(--ink3);margin-top:2px}
.ctrls{display:flex;gap:8px;flex-wrap:wrap}
#trend .p-head>div:first-child{flex:1 1 170px;min-width:0}#trend .ctrls{flex:0 1 auto;max-width:100%}
.seg{display:inline-flex;background:#eef2f0;border-radius:11px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(20,40,60,.15)}
.nodata{padding:34px 12px;text-align:center;color:var(--ink2);font-size:13px;line-height:1.7}
.nodata .btn{margin-top:10px}

.gcard.on{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--ink),0 10px 22px -10px rgba(30,45,60,.5)}
.gtitle{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%}
.gtitle .k-tag{background:var(--navy);color:#fff}
.gcard.on .k-tag{visibility:visible}
.gbar{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;margin:12px 0 12px;background:#fff}
.gbar i{display:block;height:100%}
.gitems{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(min-width:620px){.gitems{grid-template-columns:repeat(6,minmax(0,1fr))}}
.gi{border:1px solid var(--line);border-radius:14px;padding:9px 10px;display:flex;flex-direction:column;gap:2px;background:#fafcfb}
.gi.sel{border-color:var(--ink);background:#fff;box-shadow:inset 0 0 0 1px var(--ink)}
.gi.dim{opacity:.5}
.gi .n{font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.gi .v{font-size:16px;font-weight:800}
.gi .s{font-size:11.5px;color:var(--ink2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.charts{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media(min-width:900px){.charts{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}}
.chart-box{width:100%;position:relative}
.chart-box svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.ln{display:inline-block;width:20px;height:0;border-top:3px solid;flex:none}
.tip{position:fixed;z-index:80;pointer-events:none;background:#1d2733;color:#fff;font-size:12px;padding:7px 10px;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:260px;line-height:1.5;opacity:0;transition:opacity .08s}
.tip.on{opacity:1}
.comp{display:flex;flex-direction:column;gap:12px;align-items:center}
.donut{width:min(210px,64%);flex:none}
.clist{width:100%;display:flex;flex-direction:column;gap:2px}
.crow{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:7px 8px;border-radius:10px;width:100%}
.crow:hover{background:#f3f6f5}
.crow.sel{background:#eef2f0;box-shadow:inset 0 0 0 1.5px var(--ink)}
.crow .nm{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .vv{font-size:13px;font-weight:700;text-align:right}
.crow .pp{font-size:12px;color:var(--ink2);min-width:46px;text-align:right}
.mrow{display:grid;grid-template-columns:44px minmax(0,1fr) 72px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--grid);width:100%}
.mrow .nm{font-size:13px;font-weight:800}
.mtrack{position:relative;height:14px;background:#f2f5f4;border-radius:7px}
.mtrack i{position:absolute;top:2px;bottom:2px;border-radius:5px;left:0;background:#34405a}
.mrow .vv{font-size:13px;font-weight:800;text-align:right}
.mrow .vv .lp{display:block;font-size:10.5px;font-weight:600;color:var(--ink3);margin-top:1px}
.ln{display:inline-block;width:18px;height:0;border-top:3px solid #34405a;vertical-align:middle;margin-right:4px}.ln.dsh{border-top:2px dashed #8a94a6}
.ttable td.mgb,.dtable td.mgb{font-weight:800}
.mrow.sel{background:#f3f6f5}
.subnote{font-size:11.5px;color:var(--ink3);margin-top:8px}

.twrap{overflow-x:auto;margin:0 -6px;padding:0 6px}
.ttable{width:100%;min-width:720px;border-collapse:collapse;font-size:13px}
.ttable th{font-size:11.5px;color:var(--ink3);font-weight:700;border-bottom:1px solid var(--line);padding:0;white-space:nowrap;background:#fff}
.ttable th button{width:100%;padding:9px 8px;font-weight:700;font-size:11.5px;color:var(--ink3);display:flex;gap:3px;align-items:center}
.ttable th.num button{justify-content:flex-end}
.ttable th button.on{color:var(--ink)}
.ttable td{padding:9px 8px;border-bottom:1px solid var(--grid);white-space:nowrap}
.ttable td.num,.ttable th.num{text-align:right}
.ttable th.fc,.ttable td.fc{position:sticky;left:0;background:#fff;z-index:1;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.ttable td.fc{font-weight:800}
.ttable td.mut{color:var(--ink2)}
.ttable .hd-s{display:none}
@media(max-width:480px){.ttable .hd-l{display:none}.ttable .hd-s{display:inline}.ttable td.mut,.ttable td.nb{font-size:11.5px}.ttable td.sxm{padding-left:2px;padding-right:2px}}
.ttable td.nb{font-weight:800}
.ttable td.fc.mut{font-weight:400}
.ttable tr.sum td.fc.mut{font-weight:800}
.ttable tr.sum td{background:#f6f8f7;font-weight:800}
.ttable tr.sum td.fc{background:#f6f8f7}
@media(max-width:480px){.ttable{min-width:0}.ttable td,.ttable th button{padding:9px 4px;font-size:12px}.ttable .rk,.ttable [data-c=share],.ttable [data-c=gp]{display:none}.ttable th.fc,.ttable td.fc{max-width:86px}.twrap{margin:0 -10px;padding:0 10px}.ttable .d{font-size:11px;padding:1px 5px}}
.tmore{margin-top:10px;width:100%;text-align:center;padding:10px;border-radius:12px;background:#f2f5f4;font-weight:700;font-size:13px}

.side{background:var(--side);color:#e8eef0;border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:16px}
@media(min-width:1100px){.side{position:sticky;top:22px}}
@media(max-width:1099px){
  .side{position:fixed;left:0;right:0;bottom:0;z-index:50;border-radius:24px 24px 0 0;max-height:86vh;overflow:auto;transform:translateY(104%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  .side.open{transform:none;visibility:visible;transition:transform .22s ease,visibility 0s}
  .backdrop{position:fixed;inset:0;background:rgba(10,18,24,.45);z-index:40;display:none}
  .backdrop.on{display:block}
}
.side h3{font-size:15px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.fld{display:flex;flex-direction:column;gap:7px}
.fld .lb{font-size:12px;color:#aebcc3;font-weight:700}
.side select{width:100%;padding:10px 12px;border-radius:12px;background:var(--side2);color:#fff;border:1px solid #3a4651;font:inherit;font-size:14px}
.side .seg{background:var(--side2);display:flex}
.side .seg button{flex:1;text-align:center;color:#c9d5da}
.side .seg button[aria-pressed=true]{background:var(--mint);color:#16241d}
.side .seg.g2{display:grid;grid-template-columns:1fr 1fr}
.side .hint{font-size:11.5px;color:#93a3ab;line-height:1.5}
.side .btn.main{background:var(--mint);color:#16241d;border:0;justify-content:center;padding:12px;font-size:14px}
.side .xclose{padding:4px 8px;border-radius:8px;background:var(--side2);color:#fff;font-size:12px}
@media(min-width:1100px){.side .xclose{display:none}}
.foot{font-size:11.5px;color:var(--ink2);line-height:1.6;padding:0 4px 18px}

.detail{position:fixed;inset:0;z-index:70;background:rgba(10,18,24,.5);display:none;align-items:flex-end;justify-content:center}
.detail.on{display:flex}
.dpanel{background:#f3f6f5;width:100%;max-width:1200px;height:94vh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;overflow:hidden}
@media(min-width:900px){.detail{align-items:center}.dpanel{height:88vh;border-radius:24px}}
.dhead{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 8px;gap:8px}
.dhead h2{font-size:17px;font-weight:800}
.dtools{display:flex;flex-wrap:wrap;gap:8px;padding:6px 18px 10px;align-items:center}
.dtools select,.dtools input{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#fff;font:inherit;font-size:13px}
.dtools input{min-width:0;flex:1 1 120px}
.dbody{flex:1;overflow:auto;padding:0 12px 16px}
.dtable{min-width:820px;width:100%;border-collapse:separate;border-spacing:0;background:#fff;border-radius:16px;font-size:13px}
.dtable th{position:sticky;top:0;background:#fff;font-size:11.5px;color:var(--ink3);text-align:right;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.dtable td{padding:9px 8px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap}
.dtable th:first-child,.dtable td:first-child{text-align:left;position:sticky;left:0;background:#fff;font-weight:800;max-width:170px;overflow:hidden;text-overflow:ellipsis;z-index:1}
.dtable tr.sum td{background:#f6f8f7;font-weight:800}
.dnote{font-size:11.5px;color:var(--ink2);padding:8px 6px}
.refbox{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.refbox h3{font-size:13.5px;font-weight:800}
.refbox .note{font-size:11.5px;color:var(--ink3);margin:2px 0 8px}
.rtable{width:100%;min-width:820px;border-collapse:collapse;font-size:12px}
.rtable th{font-size:11px;color:var(--ink3);font-weight:700;padding:7px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;background:#fff}
.rtable td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--grid);white-space:nowrap}
.rtable th:first-child,.rtable td:first-child{text-align:left;position:sticky;left:0;background:#fff;font-weight:800;z-index:1}
.rtable tr.cur td{background:#f3f7f5}.rtable tr.cur td:first-child{background:#f3f7f5}
.rtable tr.dl td{font-size:11px;color:var(--ink2);background:#fff}
.rtable td.tot,.rtable th.tot{border-left:1px solid var(--line)}
.rtable td.tot{font-weight:800}
.rtable td.ytd,.rtable th.ytd{border-left:1px dotted var(--line)}.rtable td.ytd{font-weight:700;background:#fafcfb}.rtable.sn td.ytd{font-weight:400}.rtable tr.cur td.ytd{background:#f3f7f5}
.rtable td.qs{background:#f6f8f7;font-weight:700}.rtable th.qs{background:#f6f8f7;color:var(--ink2)}
.rtable td.qs.pt{font-style:italic;color:var(--ink2)}
.rtable td.na,.rtable .na{color:#b0b8c0}
.rtable.v{min-width:0;font-size:12.5px}.rtable.v td.dc,.rtable.v th.dc{font-size:11px;color:var(--ink2);font-weight:600}.rtable.v tr.sm td{background:#f6f8f7;font-weight:800;border-top:1px solid var(--line)}.rtable.v tr.cur td{background:#eef4f1}.rtable.v th{text-align:right}
.rtable small{font-weight:600;color:var(--ink3);font-size:10.5px;margin-left:3px}
.u{color:var(--up);font-weight:800}.n{color:var(--dn);font-weight:800}
.dsub{display:flex;flex-wrap:wrap;gap:8px;padding:0 18px 6px;align-items:center}
.dsub select{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#fff;font:inherit;font-size:13px}
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:6px 6px 2px}
.crumb button{padding:6px 11px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--ink2)}
.crumb button[aria-current=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.crumb .sep{color:var(--ink3);font-weight:800}
.dn-btn{font-weight:800;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;padding:2px 0}
.dn-btn span{color:var(--ink3);margin-left:4px}
.dtable.mini th:first-child,.dtable.mini td:first-child{max-width:90px}
.blk{background:#fff;border-radius:16px;padding:12px 12px 6px;margin:10px 0}
.blk-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.blk-h b{font-size:14px}
.blk-h span{font-size:12px;color:var(--ink2)}
.blk .twrap{margin:0 -4px;padding:0 4px}
.blk .rtable{min-width:900px}
.dtools[hidden]{display:none}
.p-head.gph{display:block}
.gph-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.p-head.gph .note{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.ttable th[data-c=grp],.ttable td[data-c=grp]{width:50px;min-width:50px;max-width:50px;padding-right:0}
.ttable th[data-c=grp] button{padding-right:0}
.mrow.v .mtrack i{background:#e29a3b}
.vsep{align-self:stretch;width:4px;border-left:1px solid #aab8b1;border-right:1px solid #aab8b1;margin:2px 6px}
@media(max-width:560px){.vsep{display:none!important}}
.blk.off{border:2px solid #34405a}.blk.off .blk-h{background:#34405a;border-radius:10px;padding:8px 10px;margin:-2px -2px 8px}.blk.off .blk-h b,.blk.off .blk-h span{color:#fff}.blk.off .blk-h b{font-size:15px}.blk.mute{opacity:.85}.blk.mute .blk-h b{color:var(--ink2)}
#dView button[data-v="br"]{margin-left:8px;border-left:3px double #8a98a2;border-radius:0 9px 9px 0;padding-left:12px}
@media(max-width:480px){#dView button[data-v="br"]{margin-left:5px;padding-left:9px}}
.dbr{display:contents}.dbr input{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;font:inherit;font-size:14px;flex:1 1 170px;min-width:150px}
@media(max-width:480px){#dView .xl{display:none}#dView button{padding:6px 9px}}
.brlist{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.brlist button{padding:8px 12px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:700;text-align:left}.brlist button small{display:block;font-size:11px;color:var(--ink3);font-weight:600}
.brchip{display:inline-flex;gap:8px;align-items:center;padding:8px 12px;border-radius:12px;background:#34405a;color:#fff;font-weight:800;font-size:13px;margin:6px 0}.brchip small{color:#c9d5da;font-weight:600}
.dfive{display:inline-flex;flex-wrap:wrap;gap:8px;align-items:center}
.dfive select{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#fff;font:inherit;font-size:13px}

<script>
const DATA_J = __DATA_J__;
const DATA_I = __DATA_I__;
const DATA_S = __DATA_S__;
(function(){
"use strict";
const DJ=DATA_J, DI=DATA_I, DS_=DATA_S;
[DJ,DI].forEach(c=>{c.dims.ch=c.dims.ch.map(x=>x==='직영'?'B2C':x);});
const GR=DJ.dims.grp, CHN=DJ.dims.ch, YEARS=DJ.years, LASTY=DJ.lastY, LASTM=DJ.lastM;
const CH_ORDER=[0,2,1,3]; // B2C(구 직영), B2B, 온라인, 특수
const DEF_CH=[0,2]; // 기본: B2C+B2B (= 직영)
const GC={PL:'#2a78d6',PS:'#eb6834',PI:'#1baf7a',PM:'#eda100',B2B:'#b4559a','기타':'#8a94a6'};
const VPAL=['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#6250d6','#0b7a75'];
const GRAY='#8a94a6';
/* 이익율 분모: 'selected' = 현재 선택한 매출기준, 'k' = 결산 매출 고정 (추후 확정 시 이 값만 변경) */
const MARGIN_DENOM='k';
const BASIS={
  h:{cube:DJ,amt:'s_h',sub:'sb_h',qty:'q',pl:true,label:'매출(환산)',short:'환산',hint:'결산DB · 구독을 고객판매가로 환산한 매출 (2025년~, 이전은 매출과 동일)',subNote:'환산 구독 = 구독 열 + (환산−결산) 차이'},
  k:{cube:DJ,amt:'s_k',sub:'sb_k',qty:'q',pl:true,label:'매출(결산)',short:'결산',hint:'결산DB · 구독은 수수료 수취분만 매출로 인식 (2025년~, 이전은 환산과 동일)',subNote:'결산 구독 = 결산DB 구독 열(수수료 수취분)'},
  sr:{cube:DI,amt:'a2',sub:'b2',qty:'q2',pl:false,label:'매출(일보)',short:'일보매출',hint:'일보DB 판매구분 2(매출) · 구독은 고객판매가 · 이익·재고는 제공되지 않음',subNote:'일보 구독 = 매입구분 E'},
  sd:{cube:DI,amt:'a1',sub:'b1',qty:'q1',pl:false,label:'판매(일보)',short:'일보판매',hint:'일보DB 판매구분 1(판매) · 구독은 고객판매가 · 이익·재고는 제공되지 않음',subNote:'일보 구독 = 매입구분 E'}
};
const nf=new Intl.NumberFormat('ko-KR');
const $=(s,r)=>(r||document).querySelector(s);
const M=v=>nf.format(Math.round(v/1000));
const PCT=(v,d)=>(v*100).toFixed(d==null?1:d)+'%';
const availM=y=>y===LASTY?LASTM:12;
let TREND_X=0,COMP_N=8;const COMP_REF=600;
const S={metric:'sales',year:LASTY,month:LASTM,mode:'ytd',basis:'h',chs:new Set(DEF_CH),grp:null,
        tview:'year',opb:'k',sbx:'all',span:'sync',mspan:5,comp:'vend',vend:null,tab:'md',more:false,sort:{key:'s',dir:-1}};
const DS={y:LASTY,m1:1,m2:LASTM,ax:'grp',q:'',view:'look',path:[],f5:{v:'cur',m:'sales'},br:{code:null,q:'',k:'a2'}};
const B=()=>BASIS[S.basis];
const hasPL=()=>B().pl;

/* ---------- engine ---------- */
function chMask(){ if(!S.chs.size)return null; const a=[false,false,false,false]; S.chs.forEach(i=>a[i]=true); return a; }
function vendIdx(){if(S.vend==null)return null;const i=B().cube.dims.vend.indexOf(S.vend);return i<0?-2:i;}
const filt=(ig,iv)=>({chm:chMask(),grp:ig?null:S.grp,vend:iv?null:vendIdx()});
function eachRow(c,y,m1,m2,f,cb){
  const R=c.rows,N=R.y.length,yy=R.y,mm=R.m,cc=R.ch,gg=R.grp,chm=f.chm,g=f.grp,fm=f.md==null?null:f.md,fi=f.item==null?null:f.item,fv=f.vend==null?null:f.vend,MD=R.md,IT=R.item,VD=R.vend;
  for(let i=0;i<N;i++){
    if(yy[i]!==y)continue; const m=mm[i]; if(m<m1||m>m2)continue;
    if(chm&&!chm[cc[i]])continue; if(g!=null&&gg[i]!==g)continue;
    if(fm!=null&&MD[i]!==fm)continue; if(fi!=null&&IT[i]!==fi)continue; if(fv!=null&&VD[i]!==fv)continue; cb(i);
  }
}
function blank(){return {s:0,sb:0,gp:0,rc:0,op:0,q:0,sk:0,sh:0,fk:0};}
function addRow(o,R,A,Q,i,pl,SB){o.s+=A[i];o.q+=Q[i];o.sb+=SB[i]; if(pl){o.gp+=R.gp[i];o.rc+=R.rc[i];o.op+=R.op[i];o.sk+=R.s_k[i];o.sh+=R.s_h[i];o.fk+=R.sb_k[i];}}
function agg(y,m1,m2,f){const b=B(),R=b.cube.rows,A=R[b.amt],Q=R[b.qty],o=blank();eachRow(b.cube,y,m1,m2,f,i=>addRow(o,R,A,Q,i,b.pl,R[b.sub]));return o;}
function by(dim,y,m1,m2,f){const b=B(),R=b.cube.rows,A=R[b.amt],Q=R[b.qty],D=R[dim],mp=new Map();
  eachRow(b.cube,y,m1,m2,f,i=>{let o=mp.get(D[i]);if(!o){o=blank();mp.set(D[i],o);}addRow(o,R,A,Q,i,b.pl,R[b.sub]);});return mp;}
function stock(y,m,f){let inv=0,q=0;if(!hasPL())return {inv:null,q:null};const R=DJ.rows;eachRow(DJ,y,m,m,f,i=>{inv+=R.inv[i];q+=R.invq[i];});return {inv:inv,q:q};}
function stockBy(dim,y,m,f){const mp=new Map();if(!hasPL())return mp;const R=DJ.rows,D=R[dim];eachRow(DJ,y,m,m,f,i=>{mp.set(D[i],(mp.get(D[i])||0)+R.inv[i]);});return mp;}
const mg=o=>{if(!o)return null;const d=MARGIN_DENOM==='k'?o.sk:o.s;return d?o.gp/d:null;};
/* 일시불 이익율 = (매출이익 − 구독 수수료) ÷ (매출(결산) − 구독 수수료) · 구독 수수료 = 결산DB 구독 열 */
const mgL=o=>{if(!o)return null;const d=o.sk-o.fk;return d>0?(o.gp-o.fk)/d:null;};
const mgAt=(o,m)=>{const d=S.opb==='L'?o.sk[m]-o.fk[m]:(MARGIN_DENOM==='k'?o.sk[m]:o.s[m]);return d>0?(o.gp[m]-(S.opb==='L'?o.fk[m]:0))/d:null;};
const per=()=>S.mode==='ytd'?[1,S.month]:[S.month,S.month];
function prevMonth(){return S.month>1?[S.year,S.month-1]:[S.year-1,12];}
const hasYear=y=>YEARS.indexOf(y)>=0;
/* 월별 일괄 집계 (한 번 순회) */
function monthlyPass(years,f,bb){
  const b=bb||B(),c=b.cube,R=c.rows,N=R.y.length,A=R[b.amt],Q=R[b.qty],out={};
  years.forEach(y=>{out[y]={q:new Array(13).fill(0),s:new Array(13).fill(0),gp:new Array(13).fill(0),rc:new Array(13).fill(0),sk:new Array(13).fill(0),fk:new Array(13).fill(0),sb:new Array(13).fill(0),inv:new Array(13).fill(0)};});
  const chm=f.chm,g=f.grp,fm=f.md==null?null:f.md,fi=f.item==null?null:f.item,fv=f.vend==null?null:f.vend;
  for(let i=0;i<N;i++){const o=out[R.y[i]];if(!o)continue;if(chm&&!chm[R.ch[i]])continue;if(g!=null&&R.grp[i]!==g)continue;
    if(fm!=null&&R.md[i]!==fm)continue;if(fi!=null&&R.item[i]!==fi)continue;if(fv!=null&&R.vend[i]!==fv)continue;
    const m=R.m[i];o.s[m]+=A[i];o.q[m]+=Q[i];o.sb[m]+=R[b.sub][i];if(b.pl){o.gp[m]+=R.gp[i];o.rc[m]+=R.rc[i];o.sk[m]+=R.s_k[i];o.fk[m]+=R.sb_k[i];o.inv[m]+=R.inv[i];}}
  return out;
}
function monthlyGroups(y,f){
  const b=B(),c=b.cube,R=c.rows,N=R.y.length,A=R[b.amt],out=GR.map(()=>new Array(13).fill(0));
  for(let i=0;i<N;i++){if(R.y[i]!==y)continue;if(f.chm&&!f.chm[R.ch[i]])continue;if(f.vend!=null&&R.vend[i]!==f.vend)continue;out[R.grp[i]][R.m[i]]+=A[i];}
  return out;
}

/* ---------- dominance maps (품목→MD/그룹, MD→그룹) ---------- */
function domMaps(c,amt){
  const R=c.rows,N=R.y.length,A=R[amt],ig={},im={},mgp={};
  for(let i=0;i<N;i++){const a=Math.abs(A[i]);const it=R.item[i],g=R.grp[i],md=R.md[i];
    (ig[it]=ig[it]||{})[g]=(ig[it][g]||0)+a;(im[it]=im[it]||{})[md]=(im[it][md]||0)+a;(mgp[md]=mgp[md]||{})[g]=(mgp[md][g]||0)+a;}
  const top=o=>{let k=null,v=-1,t=0;Object.keys(o).forEach(x=>{t+=o[x];if(o[x]>v){v=o[x];k=+x;}});return {k:k,share:t?v/t:1};};
  const r={ig:{},im:{},mg:{}};
  Object.keys(ig).forEach(k=>r.ig[k]=top(ig[k]).k);Object.keys(im).forEach(k=>r.im[k]=top(im[k]).k);Object.keys(mgp).forEach(k=>r.mg[k]=top(mgp[k]));
  return r;
}
const DOM={J:domMaps(DJ,'s_h'),I:domMaps(DI,'a2')};
const dom=()=>B().cube===DJ?DOM.J:DOM.I;

/* ---------- delta chips ---------- */
function dsp(v,txt){
  if(!isFinite(v))return '<span class="d na">-</span>';
  if(Math.abs(v)<0.05)return '<span class="d flat">■ '+txt+'</span>';
  return v>0?'<span class="d up">▲ '+txt+'</span>':'<span class="d dn">▼ '+txt+'</span>';
}
function gr(a,b){ if(a==null||!b||!isFinite(a)||!isFinite(b))return '<span class="d na">-</span>'; const v=(a/b-1)*100; return dsp(v,Math.abs(v).toFixed(1)+'%'); }
function pp(a,b){ if(a==null||b==null||!isFinite(a)||!isFinite(b))return '<span class="d na">-</span>'; const v=(a-b)*100; return dsp(v,Math.abs(v).toFixed(1)+'%p'); }
const NA='<span class="d na">-</span>';
/* 금액차(적자·흑자 혼재 지표용): 개선 ▲ / 악화 ▼ */
function dm(a,b){ if(a==null||b==null||!isFinite(a)||!isFinite(b))return NA; const v=a-b; return dsp(v/1000,M(Math.abs(v))); }

/* ---------- labels ---------- */
function perLabel(){const m=S.month,mm=m<10?'0'+m:m;
  return S.mode==='ytd'?(S.year+'.01'+(m===1?'':'~'+mm)+' 누계'):(S.year+'.'+mm+' 당월');}
function chName(){if(!S.chs.size)return '전체';const a=CH_ORDER.filter(i=>S.chs.has(i));if(a.length===2&&S.chs.has(0)&&S.chs.has(2))return '직영(=B2C+B2B)';return a.map(i=>CHN[i]).join('+');}

/* ---------- KPI ---------- */
function spark(vals){
  vals=vals.filter(v=>v!=null&&isFinite(v)); if(vals.length<2)return '';
  const W=200,H=56,mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rg=(mx-mn)||1;
  const pts=vals.map((v,i)=>[i*(W/(vals.length-1)),H-6-(v-mn)/rg*(H-16)]);
  const d='M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L');
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true"><path d="'+d+' L'+W+','+H+' L0,'+H+' Z" fill="#fff" fill-opacity=".35"/><path d="'+d+'" fill="none" stroke="#fff" stroke-width="2"/></svg>';
}

  const mpass=monthlyPass([Y],f)[Y];
  const cards=[];
  const diff=pl&&Y>=2025?cur.sh-cur.sk:0;

    r:[[l1,gr(cur.s,py&&py.s)],[ytd?'당월 '+M(cm.s)+' · 전월비':'전월비',gr(cm.s,pm&&pm.s)],

      r:[[l1.replace('비','차'),pp(mc,mp)],[ytd?'당월 '+(mcm==null?'-':PCT(mcm))+' · 전월차':'전월차',pp(mcm,mpm)],['일시불 '+(ml==null?'-':PCT(ml)),pp(ml,mlp)]],
      sp:spark(mono(m=>{const d=MARGIN_DENOM==='k'?mpass.sk[m]:mpass.s[m];return d?mpass.gp[m]/d:null;}))});
    const st=stock(Y,Mo,f),stpy=hasYear(Y-1)?stock(Y-1,Mo,f):null,stpm=hasYear(pmv[0])?stock(pmv[0],pmv[1],f):null;

/* ---------- trend ---------- */
function nice(mn,mx,n){
  if(mx===mn){mx=mn+1;}
  const rg=(mx-mn)/(n||4),p=Math.pow(10,Math.floor(Math.log10(rg))),f=rg/p,s=(f<=1?1:f<=2?2:f<=5?5:10)*p;
  const a=Math.floor(mn/s)*s,b=Math.ceil(mx/s)*s,t=[];for(let v=a;v<=b+1e-9;v+=s)t.push(v);return t;
}
const fmtMetric=v=>S.metric==='opm'?PCT(v):M(v);
const SERC=['#34405a','#2a78d6','#6f7f90','#9aa5b0','#c0c8d0','#d4a95a','#3d9a8b','#a35c8f'];
/* 비교 연수(3년/5년/전체) — 연도별·월별 공통. 재고는 2019년 제외 */
function spanYears(){const ys=[];for(let k=0;k<=LASTY-YEARS[0];k++){if(S.mspan&&k>=S.mspan)break;const y=LASTY-k;if(hasYear(y)&&!(S.metric==='inv'&&y<2020))ys.push(y);}return ys;}
function spanSeg(){return '<div class="seg" role="group" aria-label="비교 연수">'+[[3,'3년'],[5,'5년'],[0,'전체']].map(a=>'<button type="button" data-set="mspan:'+a[0]+'" aria-pressed="'+(S.mspan===a[0])+'">'+a[1]+'</button>').join('')+'</div>';}
const spanLbl=()=>S.mspan?'최근 '+S.mspan+'개년':'전체 기간';
function renderTrend(){

  let ctr='<div class="seg" role="group" aria-label="보기 단위"><button type="button" data-set="tview:year" aria-pressed="'+yr+'">연도별</button><button type="button" data-set="tview:month" aria-pressed="'+!yr+'">월별</button></div>';
  if(yr)ctr+='<div class="seg" role="group" aria-label="비교 기간"><button type="button" data-set="span:sync" aria-pressed="'+sync+'">동기</button><button type="button" data-set="span:full" aria-pressed="'+!sync+'">연간</button></div>'+spanSeg();

/* ---------- 3개년 월별 참고표 (억원) ---------- */
const nf1=new Intl.NumberFormat('ko-KR',{minimumFractionDigits:1,maximumFractionDigits:1});
const E=v=>nf1.format(v/100000); /* 천원 → 억원 */
const sp=(cls,t)=>'<span class="'+cls+'">'+t+'</span>';
function dtxt(kind,a,b){
  if(a==null||b==null||!isFinite(a)||!isFinite(b))return '-';
  if(kind==='opm'){const v=(a-b)*100;return Math.abs(v)<0.05?'■ 0.0%p':sp(v>0?'u':'n',(v>0?'▲ ':'▼ ')+Math.abs(v).toFixed(1)+'%p');}
  if(kind==='gp'){const v=a-b;return Math.abs(v)<5000?'■ 0.0':sp(v>0?'u':'n',(v>0?'▲ ':'▼ ')+E(Math.abs(v)));}
  if(!b)return '-';const v=(a/b-1)*100;return Math.abs(v)<0.05?'■ 0.0%':sp(v>0?'u':'n',(v>0?'▲ ':'▼ ')+Math.abs(v).toFixed(1)+'%');
}
const nf0=new Intl.NumberFormat('ko-KR',{maximumFractionDigits:0});
function renderRef(){
  const host=$('#ref');if(!host)return;
  if(S.tview!=='month'){host.innerHTML='';return;}
  if(needsPL()&&!hasPL()){host.innerHTML='';return;}
  const compact=window.matchMedia('(max-width:480px)').matches,kind=S.metric==='grp'?'sales':S.metric,f=filt(S.metric==='grp');
  const den=o=>MARGIN_DENOM==='k'?o.sk:o.s;
  const fmt=v=>v==null||!isFinite(v)?'–':(kind==='opm'?(v*100).toFixed(1):(kind==='gp'?nf1.format(v/100000):nf0.format(v/100000)));
  let rows=[];
  if(S.metric==='grp'){
    const g=monthlyGroups(LASTY,f),am=availM(LASTY);
    rows=GR.map((n,i)=>({label:n,color:GC[n],bold:false,v:m=>m<=am?g[i][m]:null}));
  } else {
    const ys=spanYears();
    const mp=monthlyPass(ys,f);
    rows=ys.map((y,k)=>({label:compact?'’'+String(y).slice(2):String(y),color:SERC[Math.min(k,SERC.length-1)],bold:k===0,v:m=>{
      if(m>availM(y))return null;const o=mp[y];
      if(kind==='sales')return S.sbx==='L'?o.s[m]-o.sb[m]:o.s[m];if(kind==='gp')return o.rc[m];if(kind==='inv')return o.inv[m];
      return mgAt(o,m);}}));
  }
  let h='<div class="refbox mini"><div class="twrap"><table class="rtable h'+(kind==='gp'?' dec':'')+'"><thead><tr><th>'+(kind==='opm'?'%':'억')+'</th>';
  for(let m=1;m<=12;m++)h+='<th>'+m+(compact?'':'월')+'</th>';
  h+='</tr></thead><tbody>'+rows.map(r=>'<tr><td><i class="dot" style="background:'+r.color+';width:6px;height:6px;margin-right:3px"></i>'+r.label+'</td>'+Array.from({length:12},(_,i)=>{const v=r.v(i+1);return '<td class="'+(v==null?'na':(r.bold?'b':''))+'">'+fmt(v)+'</td>';}).join('')+'</tr>').join('')+'</tbody></table></div></div>';
  host.innerHTML=h;
}
function noPL(){return '<div class="nodata">'+metricName()+'은(는) 결산DB 기준에서만 제공됩니다.<br>일보DB에는 이익·재고 데이터가 없습니다.<br><button type="button" class="btn" data-set="basis:h">매출(환산)으로 보기</button></div>';}
function yearData(){
  const f=filt(S.metric==='grp'),out=[];
  const SY=spanYears();YEARS.filter(y=>SY.indexOf(y)>=0).forEach(y=>{
    const ab=per(),sync=S.span==='sync';
    if(sync&&ab[1]>availM(y)){out.push({y:y,na:true});return;}
    const r=sync?ab:[1,availM(y)],o={y:y};
    if(S.metric==='sales'||S.metric==='gp'||S.metric==='opm'){const a=agg(y,r[0],r[1],f);o.s=a.s;o.sb=a.sb;o.gp=a.gp;o.rc=a.rc;o.v=S.metric==='sales'?a.s:(S.metric==='gp'?a.rc:mg(a));o.vL=mgL(a);}
    else if(S.metric==='inv'){o.v=stock(y,sync?S.month:availM(y),f).inv;}
    else{const mp=by('grp',y,r[0],r[1],f);o.parts=GR.map((_,i)=>(mp.get(i)||{s:0}).s);o.v=o.parts.reduce((a,b)=>a+b,0);}
    out.push(o);
  });
  return out;
}
function rbarDn(x,y,w,h,r){r=Math.min(r,w/2,Math.max(h,0));return 'M'+x+','+y+' L'+x+','+(y+h-r)+' Q'+x+','+(y+h)+' '+(x+r)+','+(y+h)+' L'+(x+w-r)+','+(y+h)+' Q'+(x+w)+','+(y+h)+' '+(x+w)+','+(y+h-r)+' L'+(x+w)+','+y+' Z';}
function rbar(x,y,w,h,r){r=Math.min(r,w/2,Math.max(h,0));return 'M'+x+','+(y+h)+' L'+x+','+(y+r)+' Q'+x+','+y+' '+(x+r)+','+y+' L'+(x+w-r)+','+y+' Q'+(x+w)+','+y+' '+(x+w)+','+(y+r)+' L'+(x+w)+','+(y+h)+' Z';}
function drawYear(){
  const el=$('#tbox');if(!el)return;const data=yearData();

  const hasNeg=bars&&data.some(d=>!d.na&&d.v!=null&&d.v<0),hasPos=!bars||data.some(d=>!d.na&&d.v!=null&&d.v>0);
  const W=Math.max(el.clientWidth,260),H=(W<480?250:320)+(hasNeg?30:0)+TREND_X,mL=6,mR=6,mT=hasPos?44:16,mB=34+(hasNeg?34:0),iw=W-mL-mR,ih=H-mT-mB;
  const n=data.length,band=iw/n,bw=Math.min(64,band*0.6);

  if(S.metric==='opm'){
    const vs=live.map(d=>d.v).concat(live.filter(d=>d.vL!=null).map(d=>d.vL)),lo=Math.min.apply(null,vs),hi=Math.max.apply(null,vs),pad=(hi-lo||0.01)*0.6,mn=lo-pad,mx=hi+pad;
    const sy=v=>mT+(mx-v)/(mx-mn||1)*ih;const pts=[],lpts=[];
    data.forEach((d,i)=>{if(!d.na&&d.vL!=null)lpts.push([mL+band*i+band/2,sy(d.vL),d]);});
    data.forEach((d,i)=>{if(!d.na&&d.v!=null)pts.push([mL+band*i+band/2,sy(d.v),d,i]);});
    svg+='<line x1="'+mL+'" x2="'+(W-mR)+'" y1="'+(mT+ih)+'" y2="'+(mT+ih)+'" stroke="#c9d3ce"/>';
    if(lpts.length>1)svg+='<path d="M'+lpts.map(p=>p[0]+','+p[1]).join(' L')+'" fill="none" stroke="#8a94a6" stroke-width="1.6" stroke-dasharray="5 4" stroke-linejoin="round"/>';
    lpts.forEach(p=>{const d=p[2];svg+='<g data-yr="'+d.y+'" data-tip="'+d.y+'년 일시불 이익율 '+PCT(d.vL)+'<br>(매출이익−구독수수료 '+M(d.gp-d.fk)+') ÷ (결산매출−구독수수료 '+M(d.sk-d.fk)+')"><rect x="'+(p[0]-3.5)+'" y="'+(p[1]-3.5)+'" width="7" height="7" transform="rotate(45 '+p[0]+' '+p[1]+')" fill="#fff" stroke="#8a94a6" stroke-width="1.6"/><circle cx="'+p[0]+'" cy="'+p[1]+'" r="14" fill="transparent"/></g>';
      if(d.v!=null&&Math.abs(d.v-d.vL)*100>=0.5)svg+='<text x="'+p[0]+'" y="'+(p[1]+(d.vL<d.v?15:-8))+'" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6b7580">'+PCT(d.vL)+'</text>';});
    if(pts.length>1)svg+='<path d="M'+pts.map(p=>p[0]+','+p[1]).join(' L')+'" fill="none" stroke="#34405a" stroke-width="2.5" stroke-linejoin="round"/>';

function arc(cx,cy,r0,r1,a0,a1){
  const p=(r,a)=>[cx+r*Math.cos(a),cy+r*Math.sin(a)],lg=(a1-a0)>Math.PI?1:0,A=p(r1,a0),Bb=p(r1,a1),C=p(r0,a1),Dd=p(r0,a0);
  return 'M'+A+' A'+r1+','+r1+' 0 '+lg+' 1 '+Bb+' L'+C+' A'+r0+','+r0+' 0 '+lg+' 0 '+Dd+' Z';
}
function vendColors(items){ // 거래선: 고유 색상(상위 거래선은 고정색), 나머지는 미사용 색 배정

}

  const b=B(),c=b.cube,R=c.rows,F=DS.f5,Y=LASTY,N=LASTM,body=$('#dBody');
  if(F.m==='rc'&&!b.pl){body.innerHTML='<div class="nodata">경상이익은 결산DB 기준(매출 환산/결산)에서만 제공됩니다.<br><button type="button" class="btn" data-set="basis:h">매출(환산)으로 보기</button></div>';return;}
  const CY=curYears(),ys=CY.ys,isEx=y=>CY.extra.indexOf(y)>=0,noV=y=>F.m==='rc'&&isEx(y);
  const shareMode=F.m==='lump'||F.m==='sub',kind=F.m==='rc'?'gp':'sales';
  const subL=b.cube===DJ&&S.basis==='k'?'수수료':'구독';
  const diff=(A,Bb)=>{const o=new Float64Array(A.length);for(let i=0;i<A.length;i++)o[i]=A[i]-Bb[i];return o;};
  const srcOf=(w,R1,am,sb)=>w==='rc'?R1.rc:(w==='sub'?R1[sb]:(w==='lump'?diff(R1[am],R1[sb]):R1[am]));
  function merged(w){
    const r=monthlyBy('ch',CY.main,{chm:null},srcOf(w,R,b.amt,b.sub));
    if(CY.extra.length){const r2=monthlyBy('ch',CY.extra,{chm:null},w==='rc'?DI.rows.a2:srcOf(w,DI.rows,'a2','b2'),DI.rows);
      r2.mp.forEach((o,k)=>{const t=r.mp.get(k);if(t)Object.assign(t,o);else r.mp.set(k,o);});
      r.mp.forEach(o=>{CY.extra.forEach(y=>{if(!o[y])o[y]=new Array(13).fill(0);});});
      Object.assign(r.tot,r2.tot);}
    return r;
  }
  const r=merged(F.m),rs=shareMode?merged('sales'):null;
  const synOf=(o,y)=>{let t=0;for(let m=1;m<=N;m++)t+=o[y][m];return t;};
  const first=ys[ys.length-1];
  const shLab=F.m==='lump'?'일시불 비중':subL+' 비중';
  function block(title,o,os){
    const sy=synOf(o,Y),sf=ys.length>1?synOf(o,first):null;
    let h='<div class="blk"><div class="blk-h"><b>'+title+'</b><span>'+Y+'년 '+(N===1?'1월':'1~'+N+'월')+' '+E(sy)+'억'+(sf==null||shareMode?'':' · '+first+'→'+Y+' '+dtxt(kind,sy,sf))+(shareMode&&os&&synOf(os,Y)?' · '+shLab+' '+PCT(sy/synOf(os,Y)):'')+'</span></div><div class="twrap"><table class="rtable"><thead><tr><th>연도</th>';
    for(let qq=0;qq<4;qq++){for(let k=1;k<=3;k++)h+='<th>'+(qq*3+k)+'월</th>';h+='<th class="qs">'+(qq+1)+'Q</th>';}
    h+='<th class="tot">연간</th><th class="ytd">동기 계</th>'+(shareMode?'<th>'+shLab+'<small>(1~'+N+'월)</small></th>':'<th>전년비<small>(1~'+N+'월)</small></th>')+'</tr></thead><tbody>';
    ys.forEach(y=>{
      h+='<tr'+(y===Y?' class="cur"':'')+'><td>'+y+(y===LASTY&&LASTM<12?'<small>~'+LASTM+'월</small>':'')+'</td>';
      let ann=0;
      for(let qq=0;qq<4;qq++){let qs=0,got=0;
        for(let k=1;k<=3;k++){const m=qq*3+k,av=m<=availM(y);h+='<td'+(av?'':' class="na"')+'>'+(av&&!noV(y)?E(o[y][m]):'–')+'</td>';if(av&&!noV(y)){qs+=o[y][m];got++;ann+=o[y][m];}}
        h+='<td class="qs'+(got<3?' pt':'')+'">'+(got?E(qs):'–')+'</td>';}
      const hasP=ys.indexOf(y-1)>=0,dn=shareMode&&os?synOf(os,y):0;
      h+='<td class="tot">'+(noV(y)?'–':E(ann))+'</td><td class="ytd">'+(noV(y)?'–':E(synOf(o,y)))+'</td><td>'+(shareMode?(dn?PCT(synOf(o,y)/dn):'–'):(hasP&&!noV(y)&&isEx(y-1)===isEx(y)?dtxt(kind,synOf(o,y),synOf(o,y-1)):'-'))+'</td></tr>';
    });
    return h+'</tbody></table></div></div>';
  }
  const ci=n=>c.dims.ch.indexOf(n),zero=()=>{const o={};ys.forEach(y=>{o[y]=new Array(13).fill(0);});return o;};
  const getF=rr=>k=>rr.mp.get(k)||zero();
  const zyF=rr=>{const z=zero();[ci('B2C'),ci('B2B')].forEach(k=>{const o=getF(rr)(k);ys.forEach(y=>{for(let m=1;m<=12;m++)z[y][m]+=o[y][m];});});return z;};
  const totF=rr=>{const t={};ys.forEach(y=>{t[y]=rr.tot[y];});return t;};
  const lab=F.m==='rc'?'경상이익':(F.m==='lump'?'일시불(구독 제외)':(F.m==='sub'?(subL==='수수료'?'구독(수수료)':'구독'):b.label));
  let h='<div class="dnote">'+(DS.view==='all'?'전체 ':'최근 ')+ys.length+'개년 · '+(CY.extra.length&&F.m!=='rc'?CY.extra[CY.extra.length-1]+'~'+CY.extra[0]+'년은 일보DB 매출 · ':'')+lab+' · 기준 '+b.label+' · 단위 억원 · 구분 채널 · 진행연도의 분기계·연간은 가용월 누계(이탤릭=일부 월) · '+(shareMode?'비중 = '+lab+' ÷ 매출('+b.short+'), 1~'+N+'월 동기':'전년비는 1~'+N+'월 동기누계')+'</div>';
  h+=block('전사',totF(r),shareMode?totF(rs):null)+block('직영(=B2C+B2B)',zyF(r),shareMode?zyF(rs):null);
  CH_ORDER.forEach(k=>{h+=block(c.dims.ch[k],getF(r)(k),shareMode?getF(rs)(k):null);});
  body.innerHTML=h;
}

/* ---------- side + footer ---------- */
function renderSide(){
  fillSel($('#selY'),YEARS[0],LASTY,S.year,v=>v+'년');
  const am=availM(S.year);if(S.month>am)S.month=am;
  fillSel($('#selM'),1,am,S.month,v=>v+'월');
  document.querySelectorAll('#segMode button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.set==='mode:'+S.mode));
  document.querySelectorAll('#segBasis button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.set==='basis:'+S.basis));
  $('#basisHint').textContent=B().hint;
}
function renderFoot(){
  $('#foot').innerHTML='※ v2.0 · 일보DB 2019.01~, 결산DB 2019.01~'+LASTY+'.'+(LASTM<10?'0'+LASTM:LASTM)+' 집계. 매출(환산)은 구독을 고객판매가로, 매출(결산)은 수수료 수취분만 반영하며 2025년부터 차이가 발생합니다. 손익은 결산DB 경상이익(영업외 손익 포함), 이익율 = 매출이익 ÷ 매출(결산)(매출 기준 선택과 무관)이며 일보 기준에는 제공되지 않습니다. 일시불 이익율 = (매출이익 − 구독 수수료) ÷ (매출(결산) − 구독 수수료), 구독 수수료는 결산DB 구독 열이며 기준(환산/결산)과 무관하게 같은 값입니다. 직영 = B2C + B2B. 그룹은 채널이 B2B이면 B2B, 그 외는 품목군(PL/PS/PI/PM/기타)이며, 채널·그룹은 일보DB 지점코드/품목 룰, 결산DB 직영구분/신그룹 기준이라 경계가 조금 다를 수 있습니다. 일시불/구독은 참고 수치입니다(결산=결산DB 구독 열, 환산=구독 열+환산−결산 차이, 일보=매입구분 E). 2024년 이하는 환산 데이터가 없어 구독이 작게 잡힐 수 있습니다. 점포수는 직영 채널 월 판매 1천만원 이상 지점이며, 점포 구분 제외 지점(채널·물류 코드 등)은 집계하지 않습니다. 수치는 원본 대조 전입니다.';
}
function redrawTrend(){if(S.tview==='year')drawYear();else drawMonthly();}
function fitTrend(){ // PC 2단: 좌측 추이 카드 높이를 우측 구성비 카드에 맞춤
  TREND_X=0;const tr=$('#trend'),cp=$('#comp');
  if(!tr||!cp||(needsPL()&&!hasPL()))return;
  redrawTrend();
  if(Math.abs(tr.getBoundingClientRect().top-cp.getBoundingClientRect().top)>4)return;
  const natOf=el=>{const r=el.getBoundingClientRect();let n=0;Array.prototype.forEach.call(el.children,k=>{if(k.offsetHeight>0)n=Math.max(n,k.getBoundingClientRect().bottom);});return (n-r.top)+parseFloat(getComputedStyle(el).paddingBottom||0);};
  const trNat=natOf(tr);
  if(S.metric==='gp'&&S.comp==='vend'){COMP_N=9;renderComp();if(natOf(cp)>COMP_REF){COMP_N=8;renderComp();}}
  const r0=tr.getBoundingClientRect();
  const slack=r0.height-trNat;
  if(slack>6){TREND_X=Math.min(Math.floor(slack),200);redrawTrend();}
}
function renderAll(){if(S.vend!=null&&B().cube.dims.vend.indexOf(S.vend)<0)S.vend=null;renderSide();renderTop();renderKpis();renderGroups();renderTrend();COMP_N=8;renderComp();fitTrend();renderTable();renderFoot();if($('#detail').classList.contains('on'))renderDetail();}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  const so=e.target.closest('[data-sort]');
  if(so){const k=so.getAttribute('data-sort');if(S.sort.key===k)S.sort.dir=-S.sort.dir;else S.sort={key:k,dir:(k==='name'||k==='md'||k==='grp')?1:-1};renderTable();return;}
  const yr=e.target.closest('[data-yr]');if(yr){S.year=+yr.getAttribute('data-yr');renderAll();return;}
  const t=e.target.closest('[data-set]');if(!t)return;
  const p=t.getAttribute('data-set').split(':'),k=p[0],v=p[1];
  if(k==='metric')S.metric=v;
  else if(k==='ch'){if(v==='all')S.chs.clear();else{const i=+v;if(S.chs.has(i))S.chs.delete(i);else S.chs.add(i);if(S.chs.size===CHN.length)S.chs.clear();}}
  else if(k==='grp'){if(v==='all')S.grp=null;else{const i=+v;S.grp=(S.grp===i)?null:i;}}
  else if(k==='vend'){if(v==='all')S.vend=null;else{const nm=B().cube.dims.vend[+v];S.vend=(S.vend===nm)?null:nm;}}
  else if(k==='mspan')S.mspan=+v;
  else if(k==='mode'||k==='basis'||k==='span'||k==='comp'||k==='tab'||k==='tview'||k==='opb'||k==='sbx')S[k]=v;
  else if(k==='more')S.more=v==='1';
  if(k==='tab')S.more=false;
  renderAll();
});
$('#selY').addEventListener('change',e=>{S.year=+e.target.value;renderAll();});
$('#selM').addEventListener('change',e=>{S.month=+e.target.value;renderAll();});
function sideOpen(o){$('#side').classList.toggle('open',o);$('#backdrop').classList.toggle('on',o);}
$('#openSide').addEventListener('click',()=>sideOpen(true));
$('#closeSide').addEventListener('click',()=>sideOpen(false));
$('#backdrop').addEventListener('click',()=>sideOpen(false));
function detOpen(o){if(o){DS.y=S.year;DS.m1=1;DS.m2=S.month;sideOpen(false);}$('#detail').classList.toggle('on',o);if(o)renderDetail();}
$('#openDetail').addEventListener('click',()=>detOpen(true));
$('#openDetail2').addEventListener('click',()=>detOpen(true));
$('#closeDetail').addEventListener('click',()=>detOpen(false));
$('#detail').addEventListener('click',e=>{if(e.target.id==='detail')detOpen(false);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){detOpen(false);sideOpen(false);}});
$('#dY').addEventListener('change',e=>{DS.y=+e.target.value;renderDetail();});
$('#dM1').addEventListener('change',e=>{DS.m1=+e.target.value;if(DS.m1>DS.m2)DS.m2=DS.m1;renderDetail();});
$('#dM2').addEventListener('change',e=>{DS.m2=+e.target.value;if(DS.m2<DS.m1)DS.m1=DS.m2;renderDetail();});
$('#dAxis').addEventListener('click',e=>{const b=e.target.closest('[data-ax]');if(b){DS.ax=b.dataset.ax;DS.path=[];DS.q='';$('#dQ').value='';renderDetail();$('#dBody').scrollTop=0;}});
$('#dCh').addEventListener('change',e=>{const p=CHP().find(x=>x[0]===e.target.value);if(p){S.chs=new Set(p[2]);renderAll();}});
$('#dQ').addEventListener('input',e=>{DS.q=e.target.value;renderDetail();});
$('#dBasis').addEventListener('change',e=>{S.basis=e.target.value;renderAll();});
$('#fMet').addEventListener('change',e=>{DS.f5.m=e.target.value;renderDetail();});
$('#bQ').addEventListener('input',e=>{DS.br.q=e.target.value;renderDetail();});
$('#detail').addEventListener('click',e=>{
  const bk=e.target.closest('[data-bk]');if(bk){DS.br.k=bk.dataset.bk;renderDetail();return;}
  const bs=e.target.closest('[data-br]');if(bs){DS.br.code=+bs.dataset.br;DS.br.q='';$('#bQ').value='';renderDetail();$('#dBody').scrollTop=0;return;}
  const v=e.target.closest('[data-v]');if(v){DS.view=v.dataset.v;renderDetail();$('#dBody').scrollTop=0;return;}
  const fv=e.target.closest('[data-fv]');if(fv){DS.f5.v=fv.dataset.fv;renderDetail();$('#dBody').scrollTop=0;return;}
  const dr=e.target.closest('[data-drill]');
  if(dr){const c=B().cube,sq=SEQ[DS.ax]||SEQ.grp,ax=sq[Math.min(DS.path.length,sq.length-1)];if(DS.path.length<sq.length){DS.path.push({ax:ax,name:c.dims[ax][+dr.dataset.drill]});DS.q='';$('#dQ').value='';renderDetail();$('#dBody').scrollTop=0;}return;}
  const cr=e.target.closest('[data-crumb]');if(cr){DS.path=DS.path.slice(0,+cr.dataset.crumb);renderDetail();$('#dBody').scrollTop=0;return;}
});

const tip=$('#tip');
function showTip(e){const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tip.classList.remove('on');return;}
  tip.innerHTML=t.getAttribute('data-tip');tip.classList.add('on');
  const x=Math.max(8,Math.min(e.clientX+14,window.innerWidth-tip.offsetWidth-8)),y=Math.max(e.clientY-tip.offsetHeight-12,8);
  tip.style.left=x+'px';tip.style.top=y+'px';}
document.addEventListener('pointermove',showTip);
document.addEventListener('pointerdown',showTip);
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(!(needsPL()&&!hasPL())){fitTrend();renderRef();}},120);});

renderAll();
})();
</script>
</body>
